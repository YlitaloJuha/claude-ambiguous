<svg xmlns="http://www.w3.org/2000/svg" width="912" height="312" viewBox="0 0 912 312" role="img" aria-label="The ambiguity check flagging a prompt in a real terminal session">
<title>The ambiguity check flagging a prompt in a real terminal session</title>
<rect width="912" height="312" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="18.0" y="56" fill="#7f849c">❯</text>
<text x="34.9" y="56" fill="#cdd6f4">We have a bug in the login form and a bug in the export job. Just fix the bug.</text>
<text x="18.0" y="98" fill="#7f849c">⠋ Nuzzling…  4s</text>
<rect x="18.0" y="113" width="8.4" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="26.4" y="114" width="59.0" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="93.9" y="119" fill="#7f849c">16% 5h</text>
<rect x="161.3" y="113" width="16.9" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="178.2" y="114" width="50.6" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="237.2" y="119" fill="#7f849c">26% 7d</text>
<text x="726.1" y="119" fill="#7f849c">1 todo  AFK  Wrap up</text>
<text x="26.4" y="161" fill="#d9a441">Ambiguous?</text>
<text x="119.2" y="161" fill="#cdd6f4">Which bug to fix: login form or export job?</text>
<text x="26.4" y="182" fill="#7f849c">Best reading:</text>
<text x="144.4" y="182" fill="#cdd6f4">Fix whichever bug is more critical or was mentioned first (login form).</text>
<text x="641.8" y="203" fill="#cdd6f4">Tell Claude</text>
<text x="751.4" y="203" fill="#7f849c">Clarify  Dismiss</text>
<rect x="18.0" y="240" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="266" fill="#7f849c">❯</text>
<rect x="18.0" y="282" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
</g>
</svg>
