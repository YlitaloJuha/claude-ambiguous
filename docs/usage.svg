<svg xmlns="http://www.w3.org/2000/svg" width="912" height="354" viewBox="0 0 912 354" role="img" aria-label="The ambiguity check flagging a prompt in a real terminal session">
<title>The ambiguity check flagging a prompt in a real terminal session</title>
<rect width="912" height="354" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="18.0" y="56" fill="#7f849c" textLength="859.9" lengthAdjust="spacingAndGlyphs">╭────────────────────────────────────────────────────────────────────────────────────────────────────╮</text>
<text x="18.0" y="77" fill="#7f849c" textLength="16.9" lengthAdjust="spacingAndGlyphs">│ </text>
<text x="34.9" y="77" fill="#cdd6f4" textLength="657.5" lengthAdjust="spacingAndGlyphs">We have a bug in the login form and a bug in the export job. Just fix the bug.</text>
<text x="692.4" y="77" fill="#7f849c" textLength="168.6" lengthAdjust="spacingAndGlyphs">                   │</text>
<text x="18.0" y="98" fill="#7f849c" textLength="859.9" lengthAdjust="spacingAndGlyphs">╰────────────────────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="18.0" y="140" fill="#7f849c" textLength="126.4" lengthAdjust="spacingAndGlyphs">⠋ Nuzzling…  4s</text>
<text x="18.0" y="161" fill="#a6adc8" textLength="8.4" lengthAdjust="spacingAndGlyphs">━</text>
<text x="26.4" y="161" fill="#7f849c" textLength="134.9" lengthAdjust="spacingAndGlyphs">─────── 16% 5h  </text>
<text x="161.3" y="161" fill="#a6adc8" textLength="16.9" lengthAdjust="spacingAndGlyphs">━━</text>
<text x="178.2" y="161" fill="#7f849c" textLength="126.4" lengthAdjust="spacingAndGlyphs">────── 26% 7d  </text>
<text x="726.1" y="161" fill="#7f849c" textLength="168.6" lengthAdjust="spacingAndGlyphs">1 todo  AFK  Wrap up</text>
<text x="18.0" y="203" fill="#d9a441" textLength="101.2" lengthAdjust="spacingAndGlyphs"> Ambiguous? </text>
<text x="119.2" y="203" fill="#cdd6f4" textLength="362.5" lengthAdjust="spacingAndGlyphs">Which bug to fix: login form or export job?</text>
<text x="18.0" y="224" fill="#7f849c" textLength="126.4" lengthAdjust="spacingAndGlyphs"> Best reading: </text>
<text x="144.4" y="224" fill="#cdd6f4" textLength="598.5" lengthAdjust="spacingAndGlyphs">Fix whichever bug is more critical or was mentioned first (login form).</text>
<text x="641.8" y="245" fill="#cdd6f4" textLength="92.7" lengthAdjust="spacingAndGlyphs">Tell Claude</text>
<text x="734.5" y="245" fill="#7f849c" textLength="160.2" lengthAdjust="spacingAndGlyphs">  Clarify  Dismiss </text>
<text x="18.0" y="287" fill="#7f849c" textLength="876.7" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="308" fill="#7f849c" textLength="8.4" lengthAdjust="spacingAndGlyphs">❯</text>
<text x="18.0" y="329" fill="#7f849c" textLength="876.7" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
